<button mat-icon-button *ngIf="isMobile" (click)="menuToggle.emit()" aria-label="Abrir menu de navegação">
    <mat-icon>menu</mat-icon>
</button>

<span class="app-title" routerLink="/app/main">Alexandria</span>

<span class="spacer"></span>

<button mat-icon-button (click)="themeService.toggle()"
    [attr.aria-label]="themeService.mode() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'">
    <mat-icon>{{ themeService.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
</button>

<span class="app-user" *ngIf="user">
    <mat-icon>account_circle</mat-icon>
    {{ user?.username }}
</span>
